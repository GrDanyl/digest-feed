name: Send digest to Telegram

on:
  push:
    branches: [main]
    paths:
      - 'issues/**.md'
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to a specific issues/*.md file (optional; defaults to the newest file in issues/)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine files to send
        id: files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_FILE="${{ github.event.inputs.file }}"
            if [ -n "$INPUT_FILE" ]; then
              FILES="$INPUT_FILE"
            else
              FILES=$(ls -1 issues/*.md 2>/dev/null | sort | tail -n 1 || true)
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # First push to the branch: diff against the empty tree.
              BEFORE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
            FILES=$(git diff --diff-filter=A --name-only "$BEFORE" "${{ github.sha }}" -- 'issues/*.md')
          fi

          echo "Files to send:"
          echo "$FILES"

          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: steps.files.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Sending $file"
            node scripts/send-telegram.mjs "$file"
          done <<< "${{ steps.files.outputs.files }}"
